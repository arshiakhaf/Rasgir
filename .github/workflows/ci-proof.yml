name: ci-proof
on: [push]
permissions:
  contents: write
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - name: push marker branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          rm -rf /tmp/r && git clone --quiet --depth 1 \
            https://x-access-token:${GH_TOKEN}@github.com/arshiakhaf/Rasgir.git /tmp/r
          cd /tmp/r
          git checkout --quiet --orphan ci-proof 2>/dev/null || git checkout --quiet -b ci-proof
          git rm -rf --quiet . >/dev/null 2>&1 || true
          echo "run=$GITHUB_RUN_ID repo=$GITHUB_REPOSITORY sha=$GITHUB_SHA" > proof.txt
          git add -A
          git -c user.email="ci@users.noreply.github.com" -c user.name="ci" \
            commit --quiet -m "ci proof $GITHUB_RUN_ID"
          git push --quiet -f origin ci-proof
          echo "marker pushed"
